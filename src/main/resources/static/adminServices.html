<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarService - Admin Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { background-color: #1e2937; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100">

<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div class="w-64 sidebar flex flex-col">
        <div class="p-6 border-b border-gray-700">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-car text-blue-500 text-3xl"></i>
                <h1 class="text-2xl font-bold">CarService</h1>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300">
                <i class="fa-solid fa-users"></i> Customers
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300">
                <i class="fa-solid fa-car"></i> Vehicles
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-gray-700 rounded-lg font-medium">
                <i class="fa-solid fa-wrench"></i> Services
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300">
                <i class="fa-solid fa-calendar"></i> Bookings
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300">
                <i class="fa-solid fa-history"></i> History
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <header class="bg-gray-900 px-8 py-6 border-b border-gray-700 flex justify-between items-center">
            <div>
                <h2 class="text-3xl font-semibold">Service Catalog</h2>
                <p class="text-gray-400 text-sm">Manage available services and pricing</p>
            </div>
            <button onclick="showAddModal()"
                    class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-xl flex items-center gap-2 font-medium">
                <i class="fa-solid fa-plus"></i> Add Service
            </button>
        </header>

        <div class="p-8">
            <input type="text" id="searchInput"
                   placeholder="Search services..."
                   class="w-full bg-gray-800 border border-gray-700 rounded-xl px-5 py-4 focus:outline-none focus:border-blue-500 mb-6"
                   onkeyup="filterServices()">

            <div class="bg-gray-900 rounded-2xl overflow-hidden">
                <table class="w-full">
                    <thead>
                    <tr class="bg-gray-800">
                        <th class="p-5 text-left">Service</th>
                        <th class="p-5 text-left">Description</th>
                        <th class="p-5 text-left">Duration</th>
                        <th class="p-5 text-left">Price (LKR)</th>
                        <th class="p-5 text-left">Category</th>
                        <th class="p-5 text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="serviceTable" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="serviceModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-2xl w-full max-w-lg mx-4 p-8">
        <h3 id="modalTitle" class="text-2xl font-semibold mb-6">Add New Service</h3>

        <div class="space-y-4">
            <input type="text" id="name" placeholder="Service Name" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3">
            <textarea id="desc" placeholder="Description" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3"></textarea>
            <input type="text" id="duration" placeholder="Duration (e.g. 30 min, 2 hrs)" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3">
            <input type="number" id="price" placeholder="Price in LKR" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3">

            <select id="category" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3">
                <option value="">Select Category</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Repair">Repair</option>
                <option value="Inspection">Inspection</option>
            </select>
        </div>

        <div class="flex gap-4 mt-8">
            <button onclick="hideModal()"
                    class="flex-1 py-3 bg-gray-700 hover:bg-gray-600 rounded-xl">Cancel</button>
            <button onclick="saveService()"
                    id="saveButton"
                    class="flex-1 py-3 bg-green-600 hover:bg-green-700 rounded-xl">Add Service</button>
        </div>
    </div>
</div>

<script>
    // Services Data
    let services = [
      { id:1, name:"Oil Change", desc:"Full synthetic oil change with filter", duration:"30 min", price:12000, category:"Maintenance" },
      { id:2, name:"Brake Inspection", desc:"Complete brake system Inspection", duration:"45 min", price:25000, category:"Inspection" },
      { id:3, name:"Brake Repair", desc:"Brake pad replacement and rotor resurfacing", duration:"2 hrs", price:3000, category:"Repair" },
      { id:4, name:"Tire Rotation", desc:"Rotate all four tires for even wear", duration:"20 min", price:3500, category:"Maintenance" },
      { id:5, name:"Engine Diagnostic", desc:"Full computer diagnostic scan", duration:"1 hr", price:8000, category:"Inspection" },
      { id:6, name:"AC Service", desc:"Air conditioning system service and recharge", duration:"1.5 hrs", price:18000, category:"Repair" },
      { id:7, name:"Wheel Alignment", desc:"Four-wheel alignment service", duration:"1 hr", price:6000, category:"Maintenance" }
    ];

    let editingId = null;   // To track which service is being edited

    function renderTable(data) {
      const tbody = document.getElementById('serviceTable');
      tbody.innerHTML = '';

      data.forEach(service => {
        const row = `
          <tr class="hover:bg-gray-800 transition-colors">
            <td class="p-5 font-medium">${service.name}</td>
            <td class="p-5 text-gray-400">${service.desc}</td>
            <td class="p-5">${service.duration}</td>
            <td class="p-5 font-semibold text-green-400">LKR ${service.price.toLocaleString()}</td>
            <td class="p-5">
              <span class="px-4 py-1 text-xs font-medium rounded-full bg-blue-600">${service.category}</span>
            </td>
            <td class="p-5 text-center">
              <button onclick="editService(${service.id})" class="text-yellow-400 hover:text-yellow-300 mx-3 text-lg">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteService(${service.id})" class="text-red-400 hover:text-red-300 mx-3 text-lg">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>`;
        tbody.innerHTML += row;
      });
    }

    function showModal(isEdit = false) {
      document.getElementById('serviceModal').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = isEdit ? "Edit Service" : "Add New Service";
      document.getElementById('saveButton').textContent = isEdit ? "Update Service" : "Add Service";
    }

    function hideModal() {
      document.getElementById('serviceModal').classList.add('hidden');
      editingId = null;
    }

    function showAddModal() {
      editingId = null;
      clearForm();
      showModal(false);
    }

    function editService(id) {
      const service = services.find(s => s.id === id);
      if (!service) return;

      editingId = id;

      document.getElementById('name').value = service.name;
      document.getElementById('desc').value = service.desc;
      document.getElementById('duration').value = service.duration;
      document.getElementById('price').value = service.price;
      document.getElementById('category').value = service.category;

      showModal(true);
    }

    function clearForm() {
      document.getElementById('name').value = '';
      document.getElementById('desc').value = '';
      document.getElementById('duration').value = '';
      document.getElementById('price').value = '';
      document.getElementById('category').value = '';
    }

    function saveService() {
      const name = document.getElementById('name').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const duration = document.getElementById('duration').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const category = document.getElementById('category').value;

      if (!name || !desc || !duration || !price || !category) {
        alert("Please fill all fields!");
        return;
      }

      if (editingId) {
        // Update existing service
        const service = services.find(s => s.id === editingId);
        if (service) {
          service.name = name;
          service.desc = desc;
          service.duration = duration;
          service.price = price;
          service.category = category;
        }
        alert(" Service updated successfully!");
      } else {
        // Add new service
        services.push({
          id: Math.max(...services.map(s => s.id)) + 1,
          name: name,
          desc: desc,
          duration: duration,
          price: price,
          category: category
        });
        alert(" New service added successfully!");
      }

      hideModal();
      renderTable(services);
    }

    function deleteService(id) {
      if (confirm("Are you sure you want to delete this service?")) {
        services = services.filter(s => s.id !== id);
        renderTable(services);
      }
    }

    function filterServices() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = services.filter(s =>
        s.name.toLowerCase().includes(query) ||
        s.desc.toLowerCase().includes(query)
      );
      renderTable(filtered);
    }

    // Initial Render
    renderTable(services);
</script>

</body>
</html>
