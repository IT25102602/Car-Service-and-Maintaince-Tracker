<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarService - Edit Vehicle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* Disabled field style for VIN */
        .input-field:disabled {
            background: rgba(255, 255, 255, 0.02);
            color: #64748b;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .btn-submit {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .home-btn:hover {
            color: white;
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Back Button (Changed text to Back) -->
    <a href="index.html" class="home-btn flex items-center gap-2 font-medium">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>

    <!-- Edit Vehicle Form -->
    <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-lg m-5">
        <div class="text-center mb-8">
            <!-- Changed Icon and Text for Edit Mode -->
            <i class="fas fa-edit text-blue-500 text-4xl mb-4"></i>
            <h3 class="font-black text-2xl tracking-tight">Edit Vehicle Details</h3>
            <p class="text-slate-400 text-sm mt-1">Modify the vehicle information below.</p>
        </div>

        <form id="vehicleForm" class="grid grid-cols-2 gap-4">
            
            <!-- Hidden field to store Vehicle ID -->
            <input type="hidden" id="vehicleId">

            <!-- Make -->
            <div class="col-span-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">Make</label>
                <input type="text" id="make" placeholder="e.g. Toyota" class="input-field w-full rounded-2xl px-5 py-3">
            </div>

            <!-- Model -->
            <div class="col-span-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">Model</label>
                <input type="text" id="model" placeholder="e.g. Camry" class="input-field w-full rounded-2xl px-5 py-3">
            </div>

            <!-- Year -->
            <div class="col-span-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">Year</label>
                <input type="number" id="year" placeholder="2024" class="input-field w-full rounded-2xl px-5 py-3">
            </div>

            <!-- Mileage -->
            <div class="col-span-1">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">Mileage (km)</label>
                <input type="number" id="mileage" placeholder="50,000" class="input-field w-full rounded-2xl px-5 py-3">
            </div>

            <!-- VIN (Typically VIN is not editable, so I added 'disabled') -->
            <div class="col-span-2">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">VIN (Vehicle ID) <span class="text-slate-500">(Non-editable)</span></label>
                <input type="text" id="vin" placeholder="Enter 17-digit VIN" class="input-field w-full rounded-2xl px-5 py-3" disabled>
            </div>

            <!-- Linked Customer -->
            <div class="col-span-2">
                <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-2 mb-1 block">Linked Customer</label>
                <select id="customer" class="input-field w-full rounded-2xl px-5 py-3 appearance-none">
                    <option value="" disabled>Select Customer</option>
                    <option value="1">John Doe</option>
                    <option value="2">Jane Smith</option>
                </select>
            </div>
            
            <!-- Changed Button Text and Function Call -->
            <button type="button" onclick="updateVehicle()" class="btn-submit col-span-2 mt-4 py-4 rounded-2xl font-bold text-white uppercase tracking-widest text-sm">
                Update Vehicle
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    
    <!-- Inline script to load data on page load (Demo purpose) -->
    <script>
        // Typically, you'd get the vehicle ID from the URL, e.g., edit-vehicle.html?id=123
        // For this example, we'll populate it with dummy data when the page loads.
        
        window.onload = function() {
            console.log("Edit page loaded, populating data...");
            
            // Dummy Data (In a real app, this comes from your API via js/api.js)
            const vehicleData = {
                id: "101",
                make: "Toyota",
                model: "Corolla",
                year: 2022,
                mileage: 35000,
                vin: "A1B2C3D4E5F6G7H8I", // Non-editable
                customerId: "2" // Jane Smith
            };

            // Populating the form fields
            document.getElementById('vehicleId').value = vehicleData.id;
            document.getElementById('make').value = vehicleData.make;
            document.getElementById('model').value = vehicleData.model;
            document.getElementById('year').value = vehicleData.year;
            document.getElementById('mileage').value = vehicleData.mileage;
            document.getElementById('vin').value = vehicleData.vin;
            document.getElementById('customer').value = vehicleData.customerId;
        };
    </script>
</body>
</html>
