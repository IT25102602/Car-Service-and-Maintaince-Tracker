<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Service Catalog - CarService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .sidebar {
            background-color: #1e2937;
            width: 260px;
            height: 100vh;
            position: fixed;
            padding: 20px 16px;
        }
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        .subtitle {
            color: #ffffff;
            font-size: 1.05rem;
            margin-top: 4px;
        }
        .card {
            background-color: #1e2937;
            border: none;
            border-radius: 12px;
        }
        tr:hover {
            background-color: #253549 !important;
        }
        .nav-link.active {
            background-color: #14b8a6 !important;
            color: #0f172a !important;
        }
        .search-input {
            background-color: #334155;
            border: none;
            color: white;
            padding-left: 45px;
        }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="d-flex align-items-center mb-5">
        <i class="fas fa-car fs-2 text-cyan me-3"></i>
        <h4 class="mb-0">CarService</h4>
    </div>
    <ul class="nav flex-column">
        <li class="mb-2"><a href="#" class="nav-link text-light"><i class="fas fa-home me-2"></i> Dashboard</a></li>
        <li class="mb-2"><a href="#" class="nav-link text-light"><i class="fas fa-users me-2"></i> Customers</a></li>
        <li class="mb-2"><a href="#" class="nav-link text-light"><i class="fas fa-car me-2"></i> Vehicles</a></li>
        <li class="mb-2"><a href="/services" class="nav-link active"><i class="fas fa-wrench me-2"></i> Services</a></li>
        <li class="mb-2"><a href="#" class="nav-link text-light"><i class="fas fa-calendar me-2"></i> Bookings</a></li>
        <li><a href="#" class="nav-link text-light"><i class="fas fa-history me-2"></i> History</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="mb-1">Service Catalog</h3>
            <p class="subtitle">Manage available services and pricing</p>
        </div>
        <a th:href="@{/services/add}" class="btn btn-success">
            <i class="fas fa-plus"></i> Add Service
        </a>
    </div>

    <!-- Search Bar with Icon -->
    <form th:action="@{/services}" method="get" class="mb-4 position-relative" style="max-width: 500px;">
        <i class="fas fa-search search-icon"></i>
        <input type="text" name="search" class="form-control search-input py-3"
               placeholder="Search services..." th:value="${search}">
    </form>

    <div class="card">
        <table class="table table-dark mb-0">
            <thead>
            <tr>
                <th>Service</th>
                <th>Description</th>
                <th>Duration</th>
                <th>Price</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="service : ${services}">
                <td><strong th:text="${service.name}"></strong></td>
                <td th:text="${service.description}"></td>
                <td th:text="${service.duration}"></td>
                <td><strong style="color:#22d3ee" th:text="'$' + ${service.price}"></strong></td>
                <td>
                    <span class="badge bg-info" th:text="${service.category}"></span>
                </td>
                <td>
                    <a th:href="@{/services/edit/{id}(id=${service.id})}" class="btn btn-sm btn-warning me-2">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/services/delete/{id}(id=${service.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this service?')">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
