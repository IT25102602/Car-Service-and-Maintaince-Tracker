<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CarService Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .teal-gradient { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#1E2937] border-r border-slate-800 flex flex-col fixed h-full">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 teal-gradient rounded-xl flex items-center justify-center text-white text-xl shadow-lg">
                <i class="fa fa-shield-halved"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">CarService</h1>
        </div>
        <nav class="flex-1 px-4 py-8 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition-all">
                <i class="fa fa-chart-pie w-5"></i> <span>Dashboard</span>
            </a>
            <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-teal-500/10 text-teal-400 border border-teal-500/20">
                <i class="fa fa-user-shield w-5"></i> <span>Admin Panel</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-64 p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-white">Admin Moderation</h1>
                <p class="text-slate-500">Manage service records and customer feedback.</p>
            </div>
            <button onclick="openServiceModal()" class="teal-gradient text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-teal-500/20 text-sm flex items-center gap-2 transition-all hover:scale-105">
                <i class="fa fa-plus"></i> New Service Record
            </button>
        </header>

        <div class="grid grid-cols-1 gap-10">
            <!-- Service Table -->
            <section class="glass-card rounded-3xl overflow-hidden border border-slate-800">
                <div class="p-6 border-b border-slate-800 bg-slate-800/20 flex justify-between items-center">
                    <h4 class="font-bold text-white">Service History Management</h4>
                </div>
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800/30 text-slate-500 uppercase text-[10px] tracking-widest font-bold">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Vehicle</th>
                            <th class="px-6 py-4">Customer</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminServicesTable" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </section>

            <!-- Reviews Table -->
            <section class="glass-card rounded-3xl overflow-hidden border border-slate-800">
                <div class="p-6 border-b border-slate-800 bg-slate-800/20">
                    <h4 class="font-bold text-white">Review Moderation</h4>
                </div>
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800/30 text-slate-500 uppercase text-[10px] tracking-widest font-bold">
                        <tr>
                            <th class="px-6 py-4">Review ID</th>
                            <th class="px-6 py-4">Customer</th>
                            <th class="px-6 py-4">Rating</th>
                            <th class="px-6 py-4">Comment</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminReviewsTable" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </section>
        </div>
    </main>

    <!-- Modal -->
    <div id="serviceModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-2xl rounded-[40px] border border-slate-700 overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-slate-800 flex justify-between items-center">
                <h2 id="modalTitle" class="text-2xl font-bold text-white">Add Service Record</h2>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white transition-all text-xl"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-10">
                <form id="serviceForm" class="grid grid-cols-2 gap-6">
                    <input type="hidden" id="editServiceId">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Vehicle Number</label>
                        <input type="text" id="vehNum" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Customer Name</label>
                        <input type="text" id="custName" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Service Type</label>
                        <input type="text" id="servType" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Date</label>
                        <input type="date" id="servDate" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Mechanic</label>
                        <input type="text" id="mechName" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Cost</label>
                        <input type="number" step="0.01" id="servCost" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all" required>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Status</label>
                        <select id="servStatus" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-sm focus:border-teal-500 outline-none transition-all">
                            <option value="Completed">Completed</option>
                            <option value="Ongoing">Ongoing</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>
                    <div class="col-span-2 pt-4">
                        <button type="submit" class="w-full teal-gradient text-white font-bold py-4 rounded-2xl shadow-xl shadow-teal-500/20 hover:scale-[1.01] transition-all">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
