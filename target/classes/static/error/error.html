<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>An Error Occurred - CarService Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0d1b2a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.12;pointer-events:none}
.orb1{width:350px;height:350px;background:#14b8a6;top:-80px;left:-80px}
.orb2{width:280px;height:280px;background:#6366f1;bottom:-60px;right:-60px}
.box{position:relative;z-index:1;max-width:420px}
.icon-wrap{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
h2{font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:10px}
p{color:#64748b;font-size:.9rem;line-height:1.7;margin-bottom:28px}
.btn-home{display:inline-block;padding:11px 28px;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#0d1b2a;border-radius:10px;text-decoration:none;font-weight:700;font-size:.88rem;transition:.2s}
.btn-home:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,184,166,.35)}</style></head>
<body>
<div class="orb orb1" style="background:#6366f1"></div><div class="orb orb2" style="background:#14b8a6"></div>
<div class="box">
  <div class="icon-wrap" style="background:rgba(99,102,241,.1);border:2px solid rgba(99,102,241,.2)">🛠️</div>
  <h2>An Error Occurred</h2>
  <p>We are sorry, something did not go as planned. Please try again or return to the dashboard.</p>
  <a href="/" class="btn-home">Go to Dashboard</a>
</div></body></html>
