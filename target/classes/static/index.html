<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CarService Tracker - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0d1b2a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{text-align:center;margin-bottom:24px}
.brand-icon{width:58px;height:58px;background:linear-gradient(135deg,#14b8a6,#0d9488);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 13px;box-shadow:0 8px 28px rgba(20,184,166,.28)}
.brand-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:4px;letter-spacing:-.02em}
.brand p{font-size:.81rem;color:#5a7a96}
.card{background:#13243a;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:30px 28px;width:100%;max-width:450px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0d1b2a;border-radius:11px;padding:5px;gap:5px;margin-bottom:22px}
.mode-tab{padding:10px;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:#5a7a96;font-family:Inter,sans-serif;transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:7px}
.mode-tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode-tab.active{background:#13243a;color:#14b8a6;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.mode-tab:not(.active):hover{color:#94a3b8;background:rgba(255,255,255,.04)}
.card-title{font-size:1.1rem;font-weight:600;color:#fff;text-align:center;margin-bottom:4px}
.card-sub{font-size:.81rem;color:#5a7a96;text-align:center;margin-bottom:20px}
.role-wrap{background:#0d1b2a;border-radius:11px;padding:5px;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:20px}
.role-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:15px 10px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;background:transparent;color:#5a7a96;font-size:.81rem;font-weight:500;transition:all .2s ease;font-family:Inter,sans-serif;line-height:1}
.role-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role-btn:hover:not(.active){background:rgba(255,255,255,.04);color:#94a3b8}
.role-btn.active{background:#13243a;border-color:#14b8a6;color:#14b8a6;box-shadow:0 0 0 1px rgba(20,184,166,.14)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:15px}
.field label{display:block;font-size:.78rem;font-weight:500;color:#e2e8f0;margin-bottom:7px}
.req{color:#f87171;margin-left:2px}
.input-box{position:relative}
.input-box input{width:100%;background:#0f2035;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:11px 14px;color:#e2e8f0;font-size:.87rem;font-family:Inter,sans-serif;outline:none;transition:all .2s ease}
.input-box input::placeholder{color:#334d63}
.input-box input:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.12)}
.eye-btn{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:#5a7a96;cursor:pointer;display:flex;align-items:center;transition:.2s}
.eye-btn:hover{color:#94a3b8}
.eye-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.str-bar{height:3px;border-radius:2px;margin-top:6px;background:#1a2d40;overflow:hidden;display:none}
.str-fill{height:100%;border-radius:2px;transition:.3s;width:0}
.str-txt{font-size:.68rem;margin-top:3px;display:none}
.bottom-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.remember{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.79rem;color:#5a7a96;user-select:none}
.remember input[type=checkbox]{width:14px;height:14px;accent-color:#14b8a6;cursor:pointer}
.forgot{font-size:.79rem;color:#14b8a6;text-decoration:none;transition:.15s}
.forgot:hover{text-decoration:underline}
.terms{display:flex;align-items:flex-start;gap:9px;margin-bottom:18px;cursor:pointer}
.terms input{width:15px;height:15px;accent-color:#14b8a6;margin-top:2px;flex-shrink:0;cursor:pointer}
.terms span{font-size:.78rem;color:#5a7a96;line-height:1.5}
.terms a{color:#14b8a6}
.btn-main{width:100%;padding:13px;background:linear-gradient(135deg,#14b8a6,#0d9488);border:none;border-radius:10px;color:#0d1b2a;font-size:.91rem;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;letter-spacing:.02em;transition:all .2s ease;margin-bottom:14px}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(20,184,166,.38)}
.btn-main:active{transform:translateY(0)}
.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none}
.foot-note{text-align:center;font-size:.76rem;color:#2e4a63}
.foot-note a{color:#14b8a6;text-decoration:none}
.toast{position:fixed;top:20px;right:20px;background:#13243a;border:1px solid;border-radius:10px;padding:12px 20px;font-size:.82rem;font-weight:500;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:#34d399;color:#34d399}
.toast.error{border-color:#f87171;color:#f87171}
.spinner-ov{display:none;position:fixed;inset:0;background:rgba(13,27,42,.75);backdrop-filter:blur(5px);z-index:998;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner-ov.show{display:flex}
.spin{width:38px;height:38px;border:3px solid rgba(20,184,166,.2);border-top-color:#14b8a6;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{color:#e2e8f0;font-size:.88rem}
.panel{display:none}.panel.active{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.shake{animation:shake .35s ease}
</style>
</head>
<body>
<div class="brand">
  <div class="brand-icon">
    <svg viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 01-2-2V9a2 2 0 012-2h2"/><path d="M19 17h2a2 2 0 002-2V9a2 2 0 00-2-2h-2"/><rect x="5" y="7" width="14" height="10" rx="2"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/><path d="M5 12h14"/></svg>
  </div>
  <h1>CarService Tracker</h1>
  <p>Professional Car Service Management</p>
</div>

<div class="card">
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-signin" onclick="switchMode('signin')">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In
    </button>
    <button class="mode-tab" id="tab-register" onclick="switchMode('register')">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Register
    </button>
  </div>

  <!-- SIGN IN PANEL -->
  <div class="panel active" id="panel-signin">
    <div class="card-title">Welcome Back</div>
    <div class="card-sub">Sign in to access your dashboard</div>
    <div class="role-wrap">
      <button class="role-btn active" id="btn-customer" onclick="setRole('customer')">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Customer
      </button>
      <button class="role-btn" id="btn-admin" onclick="setRole('admin')">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin
      </button>
    </div>
    <div class="field">
      <label>Email Address</label>
      <div class="input-box"><input type="email" id="si-email" placeholder="your@email.com" autocomplete="email"></div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-box">
        <input type="password" id="si-pwd" placeholder="Enter your password" autocomplete="current-password">
        <button class="eye-btn" type="button" onclick="togglePwd('si-pwd')">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="bottom-row">
      <label class="remember"><input type="checkbox"> Remember me</label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>
    <button class="btn-main" id="si-btn" onclick="signIn()">Sign In as Customer</button>
    <div class="foot-note">Don't have an account? <a href="#" onclick="switchMode('register')">Register here</a></div>
  </div>

  <!-- REGISTER PANEL -->
  <div class="panel" id="panel-register">
    <div class="card-title">Create Account</div>
    <div class="card-sub">Join CarService Tracker — it's free!</div>
    <div class="form-row">
      <div class="field">
        <label>First Name<span class="req">*</span></label>
        <div class="input-box"><input type="text" id="r-fn" placeholder="John" autocomplete="given-name"></div>
      </div>
      <div class="field">
        <label>Last Name<span class="req">*</span></label>
        <div class="input-box"><input type="text" id="r-ln" placeholder="Doe" autocomplete="family-name"></div>
      </div>
    </div>
    <div class="field">
      <label>Username<span class="req">*</span></label>
      <div class="input-box"><input type="text" id="r-un" placeholder="johndoe" autocomplete="username"></div>
    </div>
    <div class="field">
      <label>Email Address<span class="req">*</span></label>
      <div class="input-box"><input type="email" id="r-em" placeholder="john@email.com" autocomplete="email"></div>
    </div>
    <div class="field">
      <label>Phone Number<span class="req">*</span></label>
      <div class="input-box"><input type="tel" id="r-ph" placeholder="+94 77 123 4567" autocomplete="tel"></div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Password<span class="req">*</span></label>
        <div class="input-box">
          <input type="password" id="r-pw" placeholder="Min 6 chars" autocomplete="new-password" oninput="checkStr(this.value)">
          <button class="eye-btn" type="button" onclick="togglePwd('r-pw')">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="str-bar" id="str-bar"><div class="str-fill" id="str-fill"></div></div>
        <div class="str-txt" id="str-txt"></div>
      </div>
      <div class="field">
        <label>Confirm Password<span class="req">*</span></label>
        <div class="input-box">
          <input type="password" id="r-cp" placeholder="Repeat password" autocomplete="new-password">
          <button class="eye-btn" type="button" onclick="togglePwd('r-cp')">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </div>
    <label class="terms">
      <input type="checkbox" id="r-tc">
      <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
    </label>
    <button class="btn-main" id="r-btn" onclick="register()">Create My Account</button>
    <div class="foot-note">Already have an account? <a href="#" onclick="switchMode('signin')">Sign in here</a></div>
  </div>
</div>

<div class="spinner-ov" id="spinner"><div class="spin"></div><div class="spin-txt" id="spin-txt">Please wait...</div></div>
<div class="toast" id="toast"></div>

<script>
let role = 'customer';

function switchMode(m) {
  document.getElementById('panel-signin').classList.toggle('active', m==='signin');
  document.getElementById('panel-register').classList.toggle('active', m==='register');
  document.getElementById('tab-signin').classList.toggle('active', m==='signin');
  document.getElementById('tab-register').classList.toggle('active', m==='register');
}

function setRole(r) {
  role = r;
  document.getElementById('btn-customer').classList.toggle('active', r==='customer');
  document.getElementById('btn-admin').classList.toggle('active', r==='admin');
  document.getElementById('si-btn').textContent = r==='customer' ? 'Sign In as Customer' : 'Sign In as Admin';
  document.getElementById('si-email').placeholder = r==='customer' ? 'your@email.com' : 'admin@carservice.com';
}

function togglePwd(id) { const i=document.getElementById(id); i.type=i.type==='password'?'text':'password'; }

function toast(msg, type='error') {
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3500);
}

function checkStr(v) {
  const bar=document.getElementById('str-bar'), fill=document.getElementById('str-fill'), txt=document.getElementById('str-txt');
  bar.style.display=fill.style.display=txt.style.display=v?'block':'none';
  let s=0; if(v.length>=6)s++; if(/[A-Z]/.test(v))s++; if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
  const lvl=[{w:'25%',c:'#f87171',l:'Weak'},{w:'50%',c:'#fbbf24',l:'Fair'},{w:'75%',c:'#60a5fa',l:'Good'},{w:'100%',c:'#34d399',l:'Strong'}];
  const l=lvl[Math.min(s-1,3)]||lvl[0]; fill.style.width=l.w; fill.style.background=l.c; txt.textContent=l.l; txt.style.color=l.c;
}

// ── REAL LOGIN ─────────────────────────────────────────
async function signIn() {
  const em = document.getElementById('si-email').value.trim();
  const pw = document.getElementById('si-pwd').value;
  if(!em){toast('Please enter your email');return;}
  if(!pw){toast('Please enter your password');return;}

  const btn = document.getElementById('si-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  document.getElementById('spin-txt').textContent = 'Signing in...';
  document.getElementById('spinner').classList.add('show');

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: em, password: pw, role })
    });
    const data = await res.json();
    if (res.ok) {
      // Store session
      sessionStorage.setItem('userId', data.userId);
      sessionStorage.setItem('email', data.email);
      sessionStorage.setItem('username', data.username);
      sessionStorage.setItem('role', data.role);
      if (data.customerId) sessionStorage.setItem('customerId', data.customerId);
      toast('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = data.role === 'CUSTOMER' ? '/customer.html' : '/admin.html';
      }, 800);
    } else {
      toast(data.message || 'Invalid credentials');
      btn.classList.add('shake');
      setTimeout(()=>btn.classList.remove('shake'), 400);
      btn.disabled = false;
      setRole(role); // restore button text
    }
  } catch(e) {
    toast('Cannot connect to server. Please try again.');
    btn.disabled = false;
    setRole(role);
  } finally {
    document.getElementById('spinner').classList.remove('show');
  }
}

// ── REAL REGISTER ─────────────────────────────────────
async function register() {
  const fn=document.getElementById('r-fn').value.trim();
  const ln=document.getElementById('r-ln').value.trim();
  const un=document.getElementById('r-un').value.trim();
  const em=document.getElementById('r-em').value.trim();
  const ph=document.getElementById('r-ph').value.trim();
  const pw=document.getElementById('r-pw').value;
  const cp=document.getElementById('r-cp').value;
  const tc=document.getElementById('r-tc').checked;
  if(!fn){toast('Please enter your first name');return;}
  if(!ln){toast('Please enter your last name');return;}
  if(!un){toast('Please enter a username');return;}
  if(!em||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Please enter a valid email');return;}
  if(!ph){toast('Please enter your phone number');return;}
  if(!pw||pw.length<6){toast('Password must be at least 6 characters');return;}
  if(pw!==cp){toast('Passwords do not match');return;}
  if(!tc){toast('Please accept the Terms of Service');return;}

  document.getElementById('spin-txt').textContent = 'Creating account...';
  document.getElementById('spinner').classList.add('show');
  document.getElementById('r-btn').disabled = true;

  try {
    const res = await fetch('/api/customers/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ firstName:fn, lastName:ln, username:un, email:em, phone:ph, password:pw })
    });
    if(res.ok) {
      const customer = await res.json();
      // Auto-login after register
      const loginRes = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email:em, password:pw, role:'customer' })
      });
      if(loginRes.ok) {
        const session = await loginRes.json();
        sessionStorage.setItem('userId', session.userId);
        sessionStorage.setItem('email', session.email);
        sessionStorage.setItem('username', session.username);
        sessionStorage.setItem('role', session.role);
        if(session.customerId) sessionStorage.setItem('customerId', session.customerId);
      }
      toast('Account created! Redirecting...','success');
      setTimeout(()=>window.location.href='/customer.html',1500);
    } else {
      const err=await res.json().catch(()=>({}));
      toast(err.message||'Registration failed. Email or username may already be in use.');
      document.getElementById('r-btn').disabled=false;
    }
  } catch(e) {
    toast('Cannot connect to server. Please try again.');
    document.getElementById('r-btn').disabled=false;
  } finally {
    document.getElementById('spinner').classList.remove('show');
  }
}

document.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const active=document.querySelector('.panel.active').id; if(active==='panel-signin') signIn(); else register(); }});
</script>
</body></html>
